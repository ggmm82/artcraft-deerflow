name: artcraft-studio
services:
  sandbox-image:
    image: ghcr.io/ggmm82/artcraft-deerflow-sandbox:sha-0725ff88eb603e47deba10f4d0a1d12cf5533c23
    command:
    - python3
    - -c
    - print("Immagine ArtCraft pronta")
    restart: 'no'
    mem_limit: 128m
  redis:
    restart: unless-stopped
    init: true
    image: redis:7.4-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory
    - 64mb
    - --maxmemory-policy
    - noeviction
    mem_limit: 128m
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
  gateway:
    restart: unless-stopped
    init: true
    image: ghcr.io/ggmm82/artcraft-deerflow-gateway:sha-0725ff88eb603e47deba10f4d0a1d12cf5533c23
    mem_limit: 1024m
    stop_grace_period: 30s
    environment:
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:?Impostare una password di almeno 16 caratteri}
      STUDIO_SANDBOX_IMAGE: ghcr.io/ggmm82/artcraft-deerflow-sandbox:sha-0725ff88eb603e47deba10f4d0a1d12cf5533c23
      DEER_FLOW_STREAM_BRIDGE_REDIS_URL: redis://redis:6379/0
      DEER_FLOW_INTERNAL_GATEWAY_BASE_URL: http://gateway:8001
      AUTH_TRUSTED_PROXIES: ''
      BETTER_AUTH_URL: https://${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST:?Impostare TRAEFIK_HOST}
      LANGSMITH_TRACING: 'false'
    volumes:
    - studio-state:/studio-state
    - deerflow-data:/app/backend/.deer-flow
    - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    labels:
    - traefik.enable=true
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-langgraph.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`) && PathPrefix(`/api/langgraph/`)
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-langgraph.entrypoints=websecure
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-langgraph.tls=true
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-langgraph.tls.certresolver=letsencrypt
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-langgraph.priority=110
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-langgraph.middlewares=${COMPOSE_PROJECT_NAME}-langgraph-rewrite
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-langgraph.service=${COMPOSE_PROJECT_NAME}-gateway
    - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-langgraph-rewrite.replacepathregex.regex=^/api/langgraph/(.*)
    - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-langgraph-rewrite.replacepathregex.replacement=/api/$${1}
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-gateway.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/studio`) || PathPrefix(`/health`))
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-gateway.entrypoints=websecure
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-gateway.tls=true
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-gateway.tls.certresolver=letsencrypt
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-gateway.priority=100
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-gateway.service=${COMPOSE_PROJECT_NAME}-gateway
    - traefik.http.services.${COMPOSE_PROJECT_NAME}-gateway.loadbalancer.server.port=8001
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/health/ready",timeout=8)
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
  frontend:
    restart: unless-stopped
    init: true
    image: ghcr.io/ggmm82/artcraft-deerflow-frontend:sha-0725ff88eb603e47deba10f4d0a1d12cf5533c23
    mem_limit: 512m
    environment:
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:?Impostare STUDIO_PASSWORD}
      BETTER_AUTH_URL: https://${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST:?Impostare TRAEFIK_HOST}
      DEER_FLOW_INTERNAL_GATEWAY_BASE_URL: http://gateway:8001
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      gateway:
        condition: service_healthy
    labels:
    - traefik.enable=true
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.entrypoints=websecure
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.tls=true
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.tls.certresolver=letsencrypt
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.priority=1
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.service=${COMPOSE_PROJECT_NAME}-frontend
    - traefik.http.services.${COMPOSE_PROJECT_NAME}-frontend.loadbalancer.server.port=3000
volumes:
  studio-state: {}
  deerflow-data: {}
  redis-data: {}
