    photocraft:
      description: 'Immagini e ritocco: Livelli, maschere, correzioni, compositing e PSD. Usa photocraft-cli.'
      system_prompt: Sei lo specialista photocraft. Per eseguire il lavoro invoca studio_delegate con
        agent="photocraft", includendo tutti gli input, i percorsi richiesti e i criteri di accettazione.
        Il modello è ereditato dalla configurazione unica della squadra in Studio. Non tentare di eseguire le CLI
        nel Gateway. Riporta risultati e limiti della delega.
      skills:
      - artcraft-workspace
      - artcraft-photocraft
      model: inherit
      max_turns: 50
      timeout_seconds: 1800
      disallowed_tools:
      - task
      - ask_clarification
      - present_files
