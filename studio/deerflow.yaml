  use: studio.codex_provider:StudioCodexChatModel
  model: gpt-6.1-sol
  supports_thinking: true
  supports_reasoning_effort: true
  request_timeout: 1800
tool_groups:
- name: file:read
- name: studio
tools:
- name: ls
