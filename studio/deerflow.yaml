config_version: 6
models:
- name: studio-codex
  display_name: Squadra ArtCraft
  use: studio.codex_provider:StudioCodexChatModel
  model: gpt-5.4
  supports_thinking: true
  supports_reasoning_effort: true
  request_timeout: 1800
tool_groups:
- name: file:read
- name: file:write
- name: studio
tools:
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: studio_delegate
  group: studio
  use: studio.tools:studio_delegate
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
skills:
  path: /app/skills
  container_path: /mnt/skills
subagents:
