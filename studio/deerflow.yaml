config_version: 6
models:
- name: studio-codex
  display_name: Squadra ArtCraft
  use: studio.codex_provider:StudioCodexChatModel
  model: gpt-6.1-sol
  supports_thinking: true
  supports_reasoning_effort: true
  request_timeout: 1800
tool_groups:
- name: file:read
- name: studio
tools:
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
- name: studio_delegate
  group: studio
  use: studio.tools:studio_delegate
- name: studio_plan
  group: studio
  use: studio.tools:studio_plan
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
skills:
  path: /app/skills
  container_path: /mnt/skills
subagents:
