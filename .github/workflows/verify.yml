name: Verify and build Studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - id: resolve
        name: Reuse a successful PR with identical content
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_pipeline.py resolve --directory reports/reuse
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.reuse == 'true'
        with:
          name: reusable-runtime
          path: reports/reuse/
          overwrite: true
  tests:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Install tools for real media and browser acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser acceptance for specialist progress
        run: |
          npm install --prefix /tmp/studio-ui-tests --no-audit --no-fund react@19.2.4 react-dom@19.2.4 esbuild@0.25.12 @tailwindcss/cli@4.1.18
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python scripts/check_delegate_progress_ui.py --node-modules /tmp/studio-ui-tests/node_modules
          python scripts/check_runtime_ui.py
          python scripts/check_provider_ui.py
      - name: Compose configuration
        env:
          STUDIO_PASSWORD: ci-only-not-a-real-credential-123456
          TRAEFIK_HOST: srv-test.hstgr.cloud
        run: docker compose config --quiet && docker compose -f config/compose.hostinger.template.yaml config --quiet
  images:
    needs: [resolve, tests]
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [gateway, frontend, sandbox, proxy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runtime once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          tags: artcraft-deerflow-${{ matrix.component }}:0.1.0
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          build-contexts: |
            deerflow=https://github.com/bytedance/deer-flow.git#0bbcccfeb117a73cdeb7a8366f56ba71c25d6f5d
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Validate DeerFlow schema and injected tool
        if: matrix.component == 'gateway'
        run: |
          docker run --rm --entrypoint python -e STUDIO_PASSWORD=ci-only-not-a-real-credential-123456 artcraft-deerflow-gateway:0.1.0 -c 'from studio.bootstrap import initialize; initialize(); from deerflow.config.app_config import AppConfig; AppConfig.from_file("/studio-state/config.yaml"); from studio.tools import studio_delegate, studio_plan; from langchain_core.utils.function_calling import convert_to_openai_tool; schemas=[convert_to_openai_tool(t) for t in (studio_delegate, studio_plan)]; assert all("runtime" not in s["function"]["parameters"]["properties"] for s in schemas); print(schemas); from studio.app import app; print(len(app.routes))'
      - name: Verify CLI registries and all native MCP servers
        if: matrix.component == 'sandbox'
        run: |
          docker run --rm --memory=2g artcraft-deerflow-sandbox:0.1.0 python3 /opt/artcraft/smoke.py --mcp --render --output /tmp/checks.json
      - name: Check Codex credentials rotation with the pinned DeerFlow provider
        if: matrix.component == 'gateway'
        run: docker run --rm --entrypoint python --mount "type=bind,src=$PWD/tests,dst=/review,readonly" artcraft-deerflow-gateway:0.1.0 -m unittest discover -s /review -p test_codex_provider.py -v
      - name: Check custom OpenAI endpoint, SDK streaming and model target isolation
        if: matrix.component == 'gateway'
        run: docker run --rm --entrypoint python -e STUDIO_REQUIRE_GATEWAY_TESTS=1 --mount "type=bind,src=$PWD/tests,dst=/review,readonly" artcraft-deerflow-gateway:0.1.0 -m unittest discover -s /review -p test_custom_providers.py -v
      - name: Check Antigravity coordinator contract
        if: matrix.component == 'gateway'
        run: docker run --rm --entrypoint python --mount "type=bind,src=$PWD/tests,dst=/review,readonly" artcraft-deerflow-gateway:0.1.0 -m unittest discover -s /review -p test_gemini_provider.py -v
      - name: Check background work survives browser disconnect
        if: matrix.component == 'gateway'
        run: docker run --rm --entrypoint python -e STUDIO_REQUIRE_GATEWAY_TESTS=1 --mount "type=bind,src=$PWD/tests,dst=/review,readonly" artcraft-deerflow-gateway:0.1.0 -m unittest discover -s /review -p test_background_runs.py -v
      - name: Check persisted progress authorization and user isolation
        if: matrix.component == 'gateway'
        run: docker run --rm --entrypoint python -e STUDIO_REQUIRE_GATEWAY_TESTS=1 --mount "type=bind,src=$PWD/tests,dst=/review,readonly" artcraft-deerflow-gateway:0.1.0 -m unittest discover -s /review -p test_progress_routes.py -v
      - name: Check adaptive orchestration tools, compact memory and explicit recovery
        if: matrix.component == 'gateway'
        run: |
          set +e
          docker run --rm --entrypoint python -e STUDIO_REQUIRE_GATEWAY_TESTS=1 --mount "type=bind,src=$PWD/tests,dst=/review,readonly" artcraft-deerflow-gateway:0.1.0 -m unittest discover -s /review -p test_adaptive_tools.py -v > /tmp/studio-tools.log 2>&1
          result=$?
          cat /tmp/studio-tools.log
          if [ "$result" -ne 0 ]; then
            python - <<'PYTHON'
          from pathlib import Path
          text = Path('/tmp/studio-tools.log').read_text()[-8000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Gateway orchestration test failed::' + text)
          PYTHON
          fi
          exit "$result"
      - name: Check memory exhaustion using genuine cgroup counters
        if: matrix.component == 'sandbox'
        run: docker run --rm --network=none --memory=256m --memory-swap=256m --pids-limit=64 --cap-drop=ALL --security-opt=no-new-privileges --mount "type=bind,src=$PWD,dst=/review,readonly" artcraft-deerflow-sandbox:0.1.0 python3 /review/scripts/check_resource_supervision.py
      - name: Check official Antigravity CLI without account credentials
        if: matrix.component == 'sandbox'
        run: docker run --rm --network=none --entrypoint python3 --mount "type=bind,src=$PWD,dst=/review,readonly" artcraft-deerflow-sandbox:0.1.0 /review/scripts/check_antigravity_native.py
      - name: Check native Codex model IDs without generation
        if: matrix.component == 'sandbox'
        run: docker run --rm --network=none --entrypoint python3 artcraft-deerflow-sandbox:0.1.0 -c 'import sys; sys.path.insert(0,"/opt/studio"); from refresh_codex import refresh; models=refresh("models"); assert models and all(m["id"] and m["label"] for m in models); print("Native Codex catalog OK")'
      - name: Run representative native file workflows for all specialists
        if: matrix.component == 'sandbox'
        run: docker run --rm --network=none --memory=1536m --memory-swap=1536m --cpus=1.5 --pids-limit=256 --cap-drop=ALL --security-opt=no-new-privileges artcraft-deerflow-sandbox:0.1.0 python3 /opt/artcraft/acceptance.py --output /mnt/user-data/outputs/acceptance/report.json
      - name: Check real multidisciplinary asset, animation, audio and editing handoffs
        if: matrix.component == 'sandbox'
        run: docker run --rm --network=none --memory=1536m --memory-swap=1536m --cpus=1.5 --pids-limit=256 --cap-drop=ALL --security-opt=no-new-privileges --mount "type=bind,src=$PWD,dst=/review,readonly" artcraft-deerflow-sandbox:0.1.0 python3 /review/scripts/check_team_pipeline.py --output /mnt/user-data/outputs/team-acceptance --simulate-audio-interruption
      - name: Validate proxy configuration
        if: matrix.component == 'proxy'
        run: |
          docker run --rm --entrypoint caddy -e STUDIO_SITE=:2026 -e STUDIO_USER=admin -e STUDIO_PASSWORD_HASH='$2a$14$7TqSh37TK/yl18PM9eaMOu/fA7YKMsBFUMDsHRUZTiZoFoRL66Eu6' artcraft-deerflow-proxy:0.1.0 validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Publish candidate by immutable digest after component checks
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "artcraft-deerflow-${COMPONENT}:0.1.0" "$registry_image"
          docker push "$registry_image"
          python scripts/release_pipeline.py record --component "$COMPONENT" --image "$registry_image" --directory reports/runtime
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: runtime-${{ matrix.component }}
          path: reports/runtime/${{ matrix.component }}.json
          overwrite: true
  startup:
    needs: [resolve, images]
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - name: Login to pull exact candidate images
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          pattern: runtime-*
          merge-multiple: true
          path: reports/runtime
      - name: Load the same images already checked, without rebuilding
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python scripts/release_pipeline.py assemble
          python scripts/release_pipeline.py pull
      # Forks never receive registry/release write access. They still get integration checks.
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        with:
          context: .
          file: docker/Dockerfile.gateway
          tags: artcraft-deerflow-gateway:0.1.0
          load: true
          build-contexts: |
            deerflow=https://github.com/bytedance/deer-flow.git#0bbcccfeb117a73cdeb7a8366f56ba71c25d6f5d
          cache-from: type=gha,scope=gateway
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        with:
          context: .
          file: docker/Dockerfile.frontend
          tags: artcraft-deerflow-frontend:0.1.0
          load: true
          build-contexts: |
            deerflow=https://github.com/bytedance/deer-flow.git#0bbcccfeb117a73cdeb7a8366f56ba71c25d6f5d
          cache-from: type=gha,scope=frontend
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        with:
          context: .
          file: docker/Dockerfile.sandbox
          tags: artcraft-deerflow-sandbox:0.1.0
          load: true
          cache-from: type=gha,scope=sandbox
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        with:
          context: .
          file: docker/Dockerfile.proxy
          tags: artcraft-deerflow-proxy:0.1.0
          load: true
          cache-from: type=gha,scope=proxy
      - name: Boot full Compose with the checked runtime images
        run: bash scripts/ci_boot.sh
      - name: Prepare and seal the verified Hostinger Compose
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          STUDIO_PASSWORD: ci-only-not-a-real-credential-123456
          TRAEFIK_HOST: srv-test.hstgr.cloud
        run: |
          python scripts/prepare_hostinger.py --commit "$GITHUB_SHA" --manifest reports/verified-runtime/runtime-manifest.json --output reports/verified-runtime/compose.hostinger.yaml
          docker compose -f reports/verified-runtime/compose.hostinger.yaml config --quiet
          python scripts/release_pipeline.py seal
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: verified-runtime
          path: reports/verified-runtime/
          overwrite: true
  release:
    needs: [resolve, startup]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.resolve.outputs.reuse == 'true' || needs.startup.result == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.reuse == 'true' && 'reusable-runtime' || 'verified-runtime' }}
          path: reports/verified-runtime
      - name: Publish PR Compose or promote the verified images to stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_pipeline.py publish
